sonar.projectKey=Shielva-Sense_shielva-mcp-ingestion-worker
sonar.projectName=shielva-mcp-ingestion-worker

# Application source (the FastAPI app + the ingestion pipeline package).
sonar.sources=src,main.py
sonar.tests=tests

sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml

# Exclude non-product code from analysis + coverage. No vendored/third-party
# code lives in this repo (shielva_common + vecs are external packages, not
# checked in), so nothing else is excluded.
sonar.coverage.exclusions=tests/**,scripts/**,jobs/worker.py,**/__init__.py
sonar.exclusions=tests/**,scripts/**,.venv/**
